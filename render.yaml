# Render Blueprint - 一键部署配置
# 文档: https://render.com/docs/blueprint-spec

services:
  # API 后端服务
  - type: web
    name: kegel-trainer-api
    runtime: node
    region: singapore  # 新加坡区域，适合中国用户
    plan: free
    rootDir: api
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        sync: false  # 需要手动设置
      - key: DB_PORT
        value: 3306
      - key: DB_USER
        sync: false  # 需要手动设置
      - key: DB_PASSWORD
        sync: false  # 需要手动设置
      - key: DB_NAME
        sync: false  # 需要手动设置

  # 静态前端网站
  - type: web
    name: kegel-trainer
    runtime: static
    region: singapore
    plan: free
    buildCommand: echo "No build needed"
    staticPublishPath: .
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
