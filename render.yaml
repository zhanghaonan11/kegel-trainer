# Render Blueprint - API 后端部署配置
# 前端已部署在 GitHub Pages，这里只部署 API
# 文档: https://render.com/docs/blueprint-spec

services:
  # API 后端服务
  - type: web
    name: kegel-trainer-api
    runtime: node
    region: singapore  # 新加坡区域，适合中国用户
    plan: free
    rootDir: api
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        sync: false  # 需要手动设置
      - key: DB_PORT
        value: 3306
      - key: DB_USER
        sync: false  # 需要手动设置
      - key: DB_PASSWORD
        sync: false  # 需要手动设置
      - key: DB_NAME
        sync: false  # 需要手动设置
